name: Fetch data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # 매시 17분(UTC)마다 최신 예약 현황 반영
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Seoul OpenAPI data
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: node scripts/fetch-venues.mjs
      - name: Fetch holidays & weather (data.go.kr)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-extras.mjs
      - name: Check Kakao map key (진단용, 실패해도 계속)
        continue-on-error: true
        env:
          KAKAO_MAP_KEY: ${{ secrets.KAKAO_MAP_KEY }}
        run: |
          KEY=$(printf '%s' "$KAKAO_MAP_KEY" | tr -d '[:space:]')
          echo "key length: ${#KEY}"
          curl -sS -o kakao.txt -w "status: %{http_code}\n" \
            -H "Referer: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            "https://dapi.kakao.com/v2/maps/sdk.js?appkey=$KEY&autoload=false"
          head -c 300 kakao.txt; echo
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_KAKAO_MAP_KEY: ${{ secrets.KAKAO_MAP_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
